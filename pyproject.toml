[project]
name = "harlequin-snowflake"
version = "0.1.0"
description = "A Harlequin adapter for Snowflake."
authors = [
    { name = "Ted Conbeer", email = "tconbeer@users.noreply.github.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 2.11 is the first version with CatalogSearchResult, which search_catalog returns
    "harlequin>=2.11,<3",
    # the `pandas` extra is what makes the connector's Arrow fetch path
    # reachable: it resolves the optional-dependency shim that `fetch_arrow_all`
    # goes through, which stays inert on pyarrow alone.
    "snowflake-connector-python[pandas]>=3.12,<4",
    # That extra allows pandas>=2.1.2, but wheels for the newer interpreters
    # start later than that -- 2.2.3 for 3.13, 2.3.3 for 3.14 -- and a floor
    # below them lets a resolver pick a version it would have to build from
    # source. These floors keep every supported Python on a wheel.
    "pandas>=2.2.3,<3; python_version < '3.14'",
    "pandas>=2.3.3,<3; python_version >= '3.14'",
]

[project.entry-points."harlequin.adapter"]
snowflake = "harlequin_snowflake:HarlequinSnowflakeAdapter"

[dependency-groups]
dev = [
    "harlequin==2.11.0",
    "ruff>=0.5,<1",
    "pytest>=7.4.3,<8",
    "mypy>=1.10.0,<2",
    "pre-commit>=3.5.0,<4",
    "pyinstrument>=4.6.1,<5",
    "tomli>=2.0; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/harlequin_snowflake",
]

[tool.hatch.build.targets.wheel.force-include]
"src/harlequin_snowflake/keywords.tsv" = "harlequin_snowflake/keywords.tsv"

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real Snowflake account; read-only.",
]

[tool.ruff]
target-version = "py310"
extend-exclude = [".claude", ".venv"]

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = [
    "src/**/*.py",
    "tests/**/*.py",
]
mypy_path = "src:stubs"

show_column_numbers = true

# show error messages from unrelated files
follow_imports = "normal"

# be strict
disallow_untyped_calls = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
strict_optional = true

warn_return_any = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["snowflake.*", "pyarrow.*", "tomli.*"]
ignore_missing_imports = true

# numpy arrives in the graph through the Snowflake connector; nothing here
# touches it directly. Its stubs use PEP 695 `type` statements, which mypy
# refuses to parse under `python_version = "3.10"`, so skip following them
# rather than give up checking against the floor this package supports.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
