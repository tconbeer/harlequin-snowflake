[project]
name = "harlequin-snowflake"
version = "0.1.0"
description = "A Harlequin adapter for Snowflake."
authors = [
    { name = "Ted Conbeer", email = "tconbeer@users.noreply.github.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 2.11 is the first version with CatalogSearchResult, which search_catalog returns
    "harlequin>=2.11,<3",
    "snowflake-connector-python>=3.12,<4",
]

[project.entry-points."harlequin.adapter"]
snowflake = "harlequin_snowflake:HarlequinSnowflakeAdapter"

[dependency-groups]
dev = [
    "harlequin==2.11.0",
    "ruff>=0.5,<1",
    "pytest>=7.4.3,<8",
    "mypy>=1.10.0,<2",
    "pre-commit>=3.5.0,<4",
    "pyinstrument>=4.6.1,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/harlequin_snowflake",
]

[tool.hatch.build.targets.wheel.force-include]
"src/harlequin_snowflake/keywords.tsv" = "harlequin_snowflake/keywords.tsv"

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real Snowflake account; read-only.",
]

[tool.ruff]
target-version = "py310"
extend-exclude = [".claude", ".venv"]

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = [
    "src/**/*.py",
    "tests/**/*.py",
]
mypy_path = "src:stubs"

show_column_numbers = true

# show error messages from unrelated files
follow_imports = "normal"

# be strict
disallow_untyped_calls = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
strict_optional = true

warn_return_any = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["snowflake.*", "pyarrow.*"]
ignore_missing_imports = true
